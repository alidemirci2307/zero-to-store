name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Validate (syntax, skill, versions, EN/TR parity, hub examples)
        run: ./scripts/validate.sh
      - name: Claude Code plugin manifest
        run: npx -y @anthropic-ai/claude-code plugin validate .
