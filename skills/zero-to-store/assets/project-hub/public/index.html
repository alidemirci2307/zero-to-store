<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="hub-token" content="__HUB_TOKEN__">
  <meta name="color-scheme" content="light dark">
  <title>Project Hub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b5bd6'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="plan.css">
  <link rel="stylesheet" href="ops.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/plan">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
        <span class="brand-text"><strong data-i18n="app.title">Project Hub</strong><span id="project">&nbsp;</span></span>
      </a>
      <nav class="seg" id="nav" aria-label="Sayfalar">
        <span class="seg-pill" id="seg-pill" aria-hidden="true"></span>
        <a href="#/plan" data-view="plan" data-i18n="nav.plan">Plan</a>
        <a href="#/needs" data-view="needs"><span data-i18n="nav.needs">Needs</span> <span class="seg-badge" id="needs-badge" hidden></span></a>
        <a href="#/ops" data-view="ops" data-i18n="nav.ops">Operations</a>
      </nav>
      <div class="topbar-right">
        <span class="live" id="live" data-i18n-title="live.title"><i></i><span data-i18n="live">Live</span></span>
        <button class="icon-btn lang-btn" id="lang" type="button" data-i18n-aria="lang"></button>
        <button class="icon-btn" id="theme" type="button" data-i18n-aria="theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="shell">
    <div class="banner banner-offline" id="offline" data-i18n-html="offline" hidden></div>

    <section class="view" id="view-plan" hidden>
      <div class="view-head">
        <div>
          <p class="eyebrow" id="plan-eyebrow" data-i18n="plan.eyebrow">Roadmap</p>
          <h1 id="plan-title">Plan</h1>
          <p class="lede" data-i18n="plan.lede"></p>
        </div>
      </div>
      <div id="plan-root"></div>
    </section>

    <section class="view" id="view-needs" hidden>
      <div class="view-head">
        <div>
          <p class="eyebrow" data-i18n="needs.eyebrow"></p>
          <h1 data-i18n="needs.title">Needs Center</h1>
          <p class="lede" data-i18n="needs.lede"></p>
        </div>
        <div class="progress" aria-live="polite">
          <svg viewBox="0 0 44 44" aria-hidden="true">
            <circle class="ring-bg" cx="22" cy="22" r="19"></circle>
            <circle class="ring-fg" id="ring" cx="22" cy="22" r="19"></circle>
          </svg>
          <div class="progress-text"><strong id="pct">0%</strong><span id="pct-sub" data-i18n="progress.done"></span></div>
        </div>
      </div>
      <nav class="tabs" id="tabs" aria-label="Filtre"></nav>
      <div class="list" id="list" aria-live="polite"></div>
      <section class="empty" id="empty" hidden>
        <div class="empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
        <h2 id="empty-title"></h2>
        <p id="empty-text"></p>
      </section>
      <footer class="foot">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <span data-i18n-html="needs.foot"></span>
      </footer>
    </section>
    <section class="view" id="view-ops" hidden>
      <div class="view-head">
        <div>
          <p class="eyebrow" data-i18n="ops.eyebrow"></p>
          <h1 data-i18n="ops.title">Operations</h1>
          <p class="lede" data-i18n="ops.lede"></p>
        </div>
      </div>
      <div id="ops-root"></div>
    </section>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="drawer-title">
    <div class="drawer-head">
      <div><p class="eyebrow" id="drawer-eyebrow"></p><h2 id="drawer-title"></h2></div>
      <button class="icon-btn" id="drawer-close" type="button" data-i18n-aria="d.close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
