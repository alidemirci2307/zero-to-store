# .github/workflows/ci.yml — on pushes to main and on PRs, validates only the CHANGED apps.
# Deploys are NOT done here: web/panel deploy via tags (deploy-*.yml), mobile releases via release.sh.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      panel: ${{ steps.filter.outputs.panel }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mobile: ['apps/mobile/**']
            panel: ['apps/panel/**', 'packages/**', 'pnpm-lock.yaml']
            web: ['apps/web/**', 'packages/**', 'pnpm-lock.yaml']

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  panel:
    needs: changes
    if: needs.changes.outputs.panel == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version is read from the root package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./apps/panel run --if-present lint
      - run: pnpm --filter ./apps/panel run --if-present test
      - run: pnpm --filter ./apps/panel build

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./apps/web run --if-present lint
      - run: pnpm --filter ./apps/web build
